<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraria Inventory Editor - Deluxe</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="https://fonts.cdnfonts.com/css/andy" rel="stylesheet">
    <script src="libs/html2canvas-pro.js"></script>

    <style>
        :root {
            --bg-color: #1c243c;
            --container-bg: rgba(28, 32, 56, 0.9);
            --text-color: #ffffff;
            --accent-color: #daae3b;
            --border-color: #3b4b7c;
            --row-hover: #2c3a63;
            --fav-color: #ff3b3b;
            --slot-bg: #141929;
            --radius: 10px;
            --table-font-size: 20px;
            --icon-size: 1.0;
        }

        body {
            font-family: 'Andy', 'Segoe UI', Tahoma, sans-serif;
            font-weight: bold;
            background: #0f1423 url('https://www.transparenttextures.com/patterns/black-thread.png');
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .block-panel {
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            background-color: var(--container-bg);
            padding: 25px 30px;
            border-radius: var(--radius);
            border: 4px solid #2d3b68;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 8px 25px rgba(0, 0, 0, 0.7);
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 42px;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
            letter-spacing: 2px;
        }

        .upload-section {
            width: 100%;
        }

        .file-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px dashed var(--border-color);
            padding: 35px 15px;
            border-radius: var(--radius);
            background-color: var(--slot-bg);
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 2px 2px 0px #000;
        }

        .file-box:hover {
            border-color: var(--accent-color);
            background-color: #192035;
        }

        .file-box.loaded {
            border-color: #00e676;
            background-color: #122420;
        }

        input[type="file"] {
            display: none;
        }

        .box-title {
            font-size: 24px;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .box-desc {
            font-size: 16px;
            color: #aaa;
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
            padding: 14px 0;
            box-sizing: border-box;
        }

        .divider {
            width: 100%;
            border: none;
            border-top: 2px dashed var(--border-color);
            margin: 0;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            box-sizing: border-box;
            background-color: var(--slot-bg);
            border: 3px solid var(--border-color);
            color: var(--text-color);
            border-radius: var(--radius);
            font-family: 'Andy', sans-serif;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .block-config {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            text-shadow: 1px 1px 0px #000;
        }

        .block-config input {
            padding: 6px;
            background-color: var(--slot-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            font-family: 'Andy', sans-serif;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }

        .block-config input[type="number"] {
            width: 75px;
        }

        .list-title-input {
            width: 160px;
            text-align: left !important;
        }

        .reset-width-btn {
            background-color: #3b4b7c;
            border: 3px solid #232d4b;
            color: white;
            padding: 8px 16px;
            font-family: 'Andy', sans-serif;
            font-size: 20px;
            font-weight: bold;
            border-radius: var(--radius);
            cursor: pointer;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0 4px 0px #171d31;
            transition: background 0.1s;
        }

        .reset-width-btn:hover {
            background-color: #4b5f9c;
        }

        .reset-width-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .add-item-btn {
            background-color: #2e7d32;
            border: 3px solid #1b5e20;
            color: white;
            padding: 12px 20px;
            font-family: 'Andy', sans-serif;
            font-size: 22px;
            font-weight: bold;
            border-radius: var(--radius);
            cursor: pointer;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0 4px 0px #114214;
            transition: background 0.1s;
            white-space: nowrap;
        }

        .star-btn {
            cursor: pointer;
            font-size: 28px;
            color: #444;
            /* Cinza para não favorito */
            transition: color 0.1s;
            user-select: none;
        }

        .star-btn.active {
            color: #ffeb3b;
            /* Amarelo para favorito */
            text-shadow: 0 0 5px #ffeb3b;
        }

        .add-item-btn:hover {
            background-color: #388e3c;
        }

        .add-item-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* ESTILOS DO DROPDOWN (AUTOCOMPLETE) */
        .autocomplete-container {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--container-bg);
            border: 3px solid #2e7d32;
            border-top: none;
            border-radius: 0 0 var(--radius) var(--radius);
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
        }

        .autocomplete-item {
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.1s;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background-color: var(--row-hover);
        }

        .auto-icon-wrapper {
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .auto-icon {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            filter: drop-shadow(2px 2px 0px #000);
            image-rendering: pixelated;
        }

        .auto-text {
            flex: 1;
            font-size: 20px;
            text-shadow: 1px 1px 0px #000;
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .auto-id {
            color: #8fa3db;
            font-family: monospace;
            font-size: 16px;
        }

        .auto-en {
            color: #aaa;
            font-style: italic;
            font-size: 16px;
        }

        .column-toggles {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 18px;
            text-shadow: 1px 1px 0px #000;
        }

        .toggle-title {
            color: var(--accent-color);
            align-self: center;
            font-size: 20px;
        }

        .options-box {
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            cursor: pointer;
            font-size: 20px;
        }

        .options-box input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            margin: 0;

        }

        .col-name-input {
            background-color: rgba(20, 25, 41, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Andy', sans-serif;
            font-size: 16px;
            width: 110px;
            font-weight: bold;
            transition: border-color 0.2s;
        }

        .col-name-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: var(--slot-bg);
        }

        .control-star {
            color: #ffeb3b;
            font-size: 18px;
            line-height: 1;
        }

        .controls-bottom-actions {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
            gap: 15px;
        }

        .item-counter-text {
            font-size: 22px;
            color: #8fa3db;
            text-shadow: 1px 1px 0px #000;
            user-select: none;
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .print-btn {
            background-color: #a45224;
            border: 3px solid #5a2810;
            color: white;
            padding: 8px 16px;
            font-family: 'Andy', sans-serif;
            font-size: 20px;
            font-weight: bold;
            border-radius: var(--radius);
            cursor: pointer;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0 4px 0px #401a0a;
            transition: background 0.1s;
        }

        .print-btn:hover {
            background-color: #bd5f2b;
        }

        .print-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .export-json-btn {
            background-color: #1976d2;
            border: 3px solid #0d47a1;
            color: white;
            padding: 8px 16px;
            font-family: 'Andy', sans-serif;
            font-size: 20px;
            font-weight: bold;
            border-radius: var(--radius);
            cursor: pointer;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0 4px 0px #0a2f6b;
            transition: background 0.1s;
        }

        .export-json-btn:hover {
            background-color: #2196f3;
        }

        .export-json-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .undo-btn {
            background-color: #535a70;
            border: 3px solid #323745;
            color: #d1d5db;
            padding: 8px 16px;
            font-family: 'Andy', sans-serif;
            font-size: 20px;
            font-weight: bold;
            border-radius: var(--radius);
            cursor: pointer;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0 4px 0px #21242e;
            transition: all 0.1s;
        }

        .undo-btn:hover:not(:disabled) {
            background-color: #636b85;
            color: white;
        }

        .undo-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        .undo-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .tables-panel {
            display: block;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            transition: max-width 0.1s ease;
        }

        .table-wrapper {
            margin-bottom: 30px;
            background-color: var(--container-bg);
            padding: 20px 25px;
            border-radius: var(--radius);
            border: 4px solid #2d3b68;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        .table-title {
            font-size: 24px;
            color: var(--accent-color);
            margin-bottom: 12px;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 1px;
        }

        .table-rounded-holder {
            width: 100%;
            border-radius: var(--radius);
            overflow: hidden;
            border: 3px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--slot-bg);
        }

        th,
        td {
            padding: 10px 15px;
            text-align: left;
            text-shadow: 2px 2px 0px #000;
            vertical-align: middle;
        }

        th {
            background-color: #141a2e;
            color: var(--accent-color);
            border-bottom: 3px solid var(--border-color);
            font-size: calc(var(--table-font-size) + 2px);
        }

        td {
            border-bottom: 1px solid var(--border-color);
            font-size: var(--table-font-size);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: var(--row-hover);
        }

        td[contenteditable="true"] {
            cursor: text;
        }

        td[contenteditable="true"]:focus {
            background-color: rgba(255, 255, 255, 0.08) !important;
            outline: none;
        }

        .delete-btn {
            color: #ff4a4a;
            cursor: pointer;
            font-size: 42px;
            text-align: center;
            user-select: none;
            transition: transform 0.1s;
            display: inline-block;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: #ff1a1a;
            transform: scale(1.2);
        }

        /* Botões de Ordenação */
        .move-btn {
            background: #3b4b7c;
            border: 1px solid #232d4b;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 2px;
            transition: background 0.1s;
        }

        .move-btn:hover:not(:disabled) {
            background-color: #4b5f9c;
        }

        .move-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .hide-actions .col-action {
            display: none !important;
        }

        .col-action-order {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .col-action-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .star {
            display: none;
        }

        .show-fav .favorited {
            color: #ffeb3b;
            background-color: rgba(218, 174, 59, 0.05);
        }

        .id-badge {
            color: #8fa3db;
            font-family: monospace;
        }

        .icon-wrapper {

            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        .item-sprite {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            filter: drop-shadow(2px 2px 0px #000);
            image-rendering: pixelated;
            zoom: var(--icon-size);
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .hide-col-id .col-id {
            display: none;
        }

        .hide-col-img .col-img {
            display: none;
        }

        .hide-col-pt .col-pt {
            display: none;
        }

        .hide-col-en .col-en {
            display: none;
        }

        .hide-col-qtd .col-qtd {
            display: none;
        }

        .is-printing {
            background-color: #181c31 !important;
            box-shadow: none !important;
        }

        .empty-state {
            text-align: center;
            font-size: 24px;
            color: #8fa3db;
            padding: 40px;
            text-shadow: 1px 1px 0px #000;
        }
    </style>
</head>

<body>

    <div class="block-panel" id="uploadPanelBlock">
        <h1>Analisador de Inventario</h1>
        <div class="upload-section">
            <div class="file-box" id="invBox" onclick="document.getElementById('invFile').click()">
                <span class="box-title" id="invTitle">Carregar Inventário Base (.json)</span>
                <span class="box-desc">Ou comece a adicionar itens manualmente abaixo</span>
                <input type="file" id="invFile" accept=".json">
            </div>
        </div>
    </div>

    <div class="block-panel" id="addItemPanel">
        <div class="controls-row" style="padding: 0;">
            <div class="autocomplete-container">
                <input type="text" id="addRowInput" class="search-box" style="width: 100%; border-color: #2e7d32;"
                    placeholder="Pesquisar por ID, Nome PT ou EN para adicionar à lista..." autocomplete="off">
                <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
            </div>
            <button class="add-item-btn" onclick="addNewItemManual()">+ Adicionar Item</button>
        </div>
    </div>

    <div class="block-panel" id="controlsPanelBlock">
        <div class="controls-panel" id="controlsPanel">

            <div class="controls-row">
                <input type="text" id="searchBox" class="search-box" placeholder="Filtrar itens exibidos...">

                <label class="options-box">
                    <input type="checkbox" id="showFavCheck">
                    <span class="control-star">★</span>
                    Destacar favoritos
                </label>


            </div>

            <hr class="divider">

            <div class="controls-row">
                <div class="block-config"">
                    <span>Fonte (px):</span>
                    <input type=" number" id="fontSizeInput" value="16" min="12" max="128" style="width: 60px;">
                </div>
                <div class="block-config">
                    <span>Ícone (x1):</span>
                    <input type="number" id="iconSizeInput" value="1.1" min="0.1" max="10.0" step="0.1"
                        style="width: 60px;">
                </div>
                <div class="block-config">
                    <span>Itens por lista:</span>
                    <input type="number" id="itemsPerBlock" value="10" min="1">
                </div>

                <div class="block-config">
                    <span>Largura (px):</span>
                    <input type="number" id="tableWidthInput" value="1000" min="400" step="50">
                </div>
                <button class="reset-width-btn" onclick="resetToDefaultWidth()">Padrão</button>

                <div class="block-config"">
                    <span>Título:</span>
                    <input type=" text" id="customListTitleInput" class="list-title-input" value="Lista de Itens">
                </div>
            </div>

            <hr class="divider">

            <div class="controls-row">
                <div class="column-toggles">
                    <span class="toggle-title">Colunas:</span>
                    <div class="options-box">
                        <input type="checkbox" id="colIdCheck" checked data-col="id">
                        <input type="text" id="colIdName" class="col-name-input" value="ID">
                    </div>
                    <div class="options-box">
                        <input type="checkbox" id="colImgCheck" checked data-col="img">
                        <input type="text" id="colImgName" class="col-name-input" value="Ícone">
                    </div>
                    <div class="options-box">
                        <input type="checkbox" id="colPtCheck" checked data-col="pt">
                        <input type="text" id="colPtName" class="col-name-input" value="Nome em Português">
                    </div>
                    <div class="options-box">
                        <input type="checkbox" id="colEnCheck" checked data-col="en">
                        <input type="text" id="colEnName" class="col-name-input" value="English Name">
                    </div>
                    <div class="options-box">
                        <input type="checkbox" id="colQtdCheck" checked data-col="qtd">
                        <input type="text" id="colQtdName" class="col-name-input" value="Qtd">
                    </div>
                </div>
            </div>

            <hr class="divider">

            <div class="controls-row">
                <div class="controls-bottom-actions">
                    <div class="item-counter-text" id="itemCounterDisplay">Exibindo 0 de 0 itens</div>

                    <div class="button-group">
                        <button class="undo-btn" id="undoBtn" onclick="undoAction()" disabled>Desfazer</button>
                        <button class="export-json-btn" onclick="exportToJson()">Exportar JSON</button>
                        <button class="print-btn" id="printBtnButton" onclick="downloadTablesImage()">Salvar
                            Imagem</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="tables-panel" id="tablesArea">
        <div class="empty-state">Inventário Vazio. Adicione itens ou carregue um arquivo .json.</div>
    </div>

    <script>
        let itemDatabase = {};
        let loadedItemsRaw = [];
        let undoHistoryStack = [];

        async function loadExternalDatabase() {
            try {
                const response = await fetch('items.json');
                if (!response.ok) throw new Error('Não foi possível ler o arquivo items.json');
                const data = await response.json();

                if (data && data.items && Array.isArray(data.items)) {
                    data.items.forEach(item => {
                        itemDatabase[item.id] = {
                            en: item.en || "Unknown Item",
                            pt: item.pt_br || "Item não catalogado"
                        };
                    });
                    console.log("Banco de dados local sincronizado!");

                    loadSettingsFromStorage();
                    buildSegmentedTables(); // Constrói a tela inicial (vazia)
                }
            } catch (err) {
                console.error("Erro ao carregar items.json: ", err);
            }
        }

        loadExternalDatabase();

        function saveSettingsToStorage() {
            const settings = {
                searchBox: document.getElementById('searchBox').value,
                itemsPerBlock: document.getElementById('itemsPerBlock').value,
                tableWidthInput: document.getElementById('tableWidthInput').value,
                customListTitle: document.getElementById('customListTitleInput').value,
                showFavCheck: document.getElementById('showFavCheck').checked,
                fontSizeInput: document.getElementById('fontSizeInput')?.value || '20',
                iconSizeInput: document.getElementById('iconSizeInput')?.value || '1.0',
                columns: {
                    id: document.getElementById('colIdCheck').checked,
                    img: document.getElementById('colImgCheck').checked,
                    pt: document.getElementById('colPtCheck').checked,
                    en: document.getElementById('colEnCheck').checked,
                    qtd: document.getElementById('colQtdCheck').checked
                },
                columnNames: {
                    id: document.getElementById('colIdName').value,
                    img: document.getElementById('colImgName').value,
                    pt: document.getElementById('colPtName').value,
                    en: document.getElementById('colEnName').value,
                    qtd: document.getElementById('colQtdName').value
                }
            };
            localStorage.setItem('terraria_editor_settings', JSON.stringify(settings));
        }

        function loadSettingsFromStorage() {
            const raw = localStorage.getItem('terraria_editor_settings');
            if (!raw) {
                applyWidthConfiguration();
                applyFontConfiguration();
                applyIconSizeConfiguration();
                return;
            }

            try {
                const settings = JSON.parse(raw);
                document.getElementById('searchBox').value = settings.searchBox || '';
                document.getElementById('itemsPerBlock').value = settings.itemsPerBlock || '10';
                document.getElementById('tableWidthInput').value = settings.tableWidthInput || '1000';
                document.getElementById('customListTitleInput').value = settings.customListTitle || 'Lista de Itens';
                document.getElementById('showFavCheck').checked = settings.showFavCheck || false;
                document.getElementById('fontSizeInput').value = settings.fontSizeInput || '20';
                document.getElementById('iconSizeInput').value = settings.iconSizeInput || '1.0';

                if (settings.columns) {
                    document.getElementById('colIdCheck').checked = settings.columns.id !== false;
                    document.getElementById('colImgCheck').checked = settings.columns.img !== false;
                    document.getElementById('colPtCheck').checked = settings.columns.pt !== false;
                    document.getElementById('colEnCheck').checked = settings.columns.en !== false;
                    document.getElementById('colQtdCheck').checked = settings.columns.qtd !== false;
                }

                if (settings.columnNames) {
                    document.getElementById('colIdName').value = settings.columnNames.id || 'ID';
                    document.getElementById('colImgName').value = settings.columnNames.img || 'Ícone';
                    document.getElementById('colPtName').value = settings.columnNames.pt || 'Nome em Português';
                    document.getElementById('colEnName').value = settings.columnNames.en || 'English Name';
                    document.getElementById('colQtdName').value = settings.columnNames.qtd || 'Qtd';
                }

                applyWidthConfiguration();
                applyFontConfiguration();
                applyIconSizeConfiguration();
            } catch (e) {
                console.error("Erro ao ler dados do localStorage", e);
            }
        }

        function applyWidthConfiguration() {
            const width = document.getElementById('tableWidthInput').value || 1000;
            const targetElement = document.getElementById('tablesArea');
            if (targetElement) { targetElement.style.maxWidth = width + "px"; }
        }

        function applyFontConfiguration() {
            const size = document.getElementById('fontSizeInput').value || 20;
            document.documentElement.style.setProperty('--table-font-size', size + 'px');
        }
        function applyIconSizeConfiguration() {
            const size = document.getElementById('iconSizeInput')?.value || 1.0;
            document.documentElement.style.setProperty('--icon-size', size);
        }
        function resetToDefaultWidth() {
            document.getElementById('tableWidthInput').value = 1000;
            applyWidthConfiguration();
            saveSettingsToStorage();
        }

        function updateTableHeaderLabels() {
            const idLabel = document.getElementById('colIdName').value;
            const imgLabel = document.getElementById('colImgName').value;
            const ptLabel = document.getElementById('colPtName').value;
            const enLabel = document.getElementById('colEnName').value;
            const qtdLabel = document.getElementById('colQtdName').value;

            document.querySelectorAll('th.th-label-id').forEach(el => el.innerText = idLabel);
            document.querySelectorAll('th.th-label-img').forEach(el => el.innerText = imgLabel);
            document.querySelectorAll('th.th-label-pt').forEach(el => el.innerText = ptLabel);
            document.querySelectorAll('th.th-label-en').forEach(el => el.innerText = enLabel);
            document.querySelectorAll('th.th-label-qtd').forEach(el => el.innerText = qtdLabel);
            saveSettingsToStorage();
        }

        function updateCustomListTitles() {
            const baseTitle = document.getElementById('customListTitleInput').value || 'Lista de Itens';
            document.querySelectorAll('.table-title').forEach((el, index) => {
                el.innerText = `${baseTitle} #${index + 1}`;
            });
            saveSettingsToStorage();
        }

        function saveHistoryState() {
            const clone = JSON.parse(JSON.stringify(loadedItemsRaw));
            undoHistoryStack.push(clone);
            if (undoHistoryStack.length > 30) undoHistoryStack.shift();
            updateUndoButtonUI();
        }

        function undoAction() {
            if (undoHistoryStack.length === 0) return;
            loadedItemsRaw = undoHistoryStack.pop();
            buildSegmentedTables();
            updateUndoButtonUI();
        }

        // --- SISTEMA DE AUTOCOMPLETE E ADIÇÃO DE LINHA ---
        const addRowInput = document.getElementById('addRowInput');
        const dropdown = document.getElementById('autocompleteDropdown');

        function addSpecificItem(id, pt, en) {
            saveHistoryState();
            loadedItemsRaw.push({
                id: parseInt(id),
                count: 1,
                isFavorited: false,
                name_ptbr: pt,
                name_eng: en
            });
            addRowInput.value = '';
            dropdown.style.display = 'none';
            buildSegmentedTables();

            // Rola para a última tabela
            setTimeout(() => {
                const wrappers = document.querySelectorAll('.table-wrapper');
                if (wrappers.length > 0) {
                    wrappers[wrappers.length - 1].scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
            }, 100);
        }

        function addNewItemManual() {
            const query = addRowInput.value.toLowerCase().trim();
            if (!query) return;

            for (const [id, data] of Object.entries(itemDatabase)) {
                if (id === query || data.pt.toLowerCase() === query || data.en.toLowerCase() === query) {
                    addSpecificItem(id, data.pt, data.en);
                    return;
                }
            }
            alert("Item exato não encontrado. Digite e selecione na lista suspensa.");
        }

        addRowInput.addEventListener('input', function () {
            const query = this.value.toLowerCase().trim();
            dropdown.innerHTML = '';

            if (!query) {
                dropdown.style.display = 'none';
                return;
            }

            let matches = [];
            for (const [id, data] of Object.entries(itemDatabase)) {
                if (id.includes(query) || data.pt.toLowerCase().includes(query) || data.en.toLowerCase().includes(query)) {
                    matches.push({ id, ...data });
                    if (matches.length > 40) break;
                }
            }

            if (matches.length > 0) {
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    const imgUrl = `sprites/Item_${match.id}.png`;

                    div.innerHTML = `
                        <div class="auto-icon-wrapper">
                            <img src="${imgUrl}" class="auto-icon" onerror="this.parentElement.style.display='none'">
                        </div>
                        <div class="auto-text">
                            <div>${match.pt} <span class="auto-id">[ID: ${match.id}]</span></div>
                            <div class="auto-en">${match.en}</div>
                        </div>
                    `;

                    div.addEventListener('click', () => addSpecificItem(match.id, match.pt, match.en));
                    dropdown.appendChild(div);
                });
                dropdown.style.display = 'block';
            } else {
                dropdown.style.display = 'none';
            }
        });

        document.addEventListener('click', function (e) {
            if (e.target !== addRowInput && e.target !== dropdown) {
                dropdown.style.display = 'none';
            }
        });

        addRowInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addNewItemManual();
            }
        });

        // --- EXPORTAR INVENTÁRIO (JSON) ---
        function exportToJson() {
            if (loadedItemsRaw.length === 0) {
                alert("O inventário está vazio!");
                return;
            }

            // Constrói objeto no padrão Terraria Inventory
            const exportData = {
                items: loadedItemsRaw.map(item => ({
                    id: parseInt(item.id),
                    count: parseInt(item.count) || 1,
                    isFavorited: !!item.isFavorited
                }))
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 4));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "meu_inventario.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // --- SISTEMA DE REORDENAÇÃO (SUBIR/DESCER) ---
        function moveItemUp(globalIndex) {
            if (globalIndex <= 0) return;
            saveHistoryState();
            const temp = loadedItemsRaw[globalIndex];
            loadedItemsRaw[globalIndex] = loadedItemsRaw[globalIndex - 1];
            loadedItemsRaw[globalIndex - 1] = temp;
            buildSegmentedTables();
        }

        function moveItemDown(globalIndex) {
            if (globalIndex >= loadedItemsRaw.length - 1) return;
            saveHistoryState();
            const temp = loadedItemsRaw[globalIndex];
            loadedItemsRaw[globalIndex] = loadedItemsRaw[globalIndex + 1];
            loadedItemsRaw[globalIndex + 1] = temp;
            buildSegmentedTables();
        }

        // --- LEITURA DE ARQUIVO JSON ---
        document.getElementById('invFile').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (data.items && Array.isArray(data.items)) {
                        document.getElementById('invBox').classList.add('loaded');
                        document.getElementById('invTitle').innerText = "✓ Inventário Lido";

                        loadedItemsRaw = data.items.filter(item => item && item.id).map(item => {
                            const dbItem = itemDatabase[item.id] || { pt: "Item não catalogado", en: "Unknown Item" };
                            return {
                                id: item.id,
                                count: item.count,
                                isFavorited: item.isFavorited || false,
                                name_ptbr: dbItem.pt,
                                name_eng: dbItem.en
                            };
                        });

                        undoHistoryStack = [];
                        updateUndoButtonUI();
                        buildSegmentedTables();
                    } else {
                        alert('Formato de inventário inválido.');
                    }
                } catch (err) {
                    alert('Erro ao ler o arquivo de inventário.');
                }
            };
            reader.readAsText(file);
            this.value = ''; // Reseta o input de arquivo
        });

        // --- CONSTRUÇÃO DA TABELA ---
        function buildSegmentedTables() {
            const container = document.getElementById('tablesArea');
            if (!container) return;
            container.innerHTML = '';

            const searchFilter = document.getElementById('searchBox').value.toLowerCase();
            const itemsPerBlock = parseInt(document.getElementById('itemsPerBlock').value) || 10;
            const highlightFavorites = document.getElementById('showFavCheck').checked;

            const idLabel = document.getElementById('colIdName').value;
            const imgLabel = document.getElementById('colImgName').value;
            const ptLabel = document.getElementById('colPtName').value;
            const enLabel = document.getElementById('colEnName').value;
            const qtdLabel = document.getElementById('colQtdName').value;
            const customTitleBase = document.getElementById('customListTitleInput').value || 'Lista de Itens';

            const filteredItems = loadedItemsRaw.filter(item => {
                return item.id.toString().includes(searchFilter) ||
                    item.name_ptbr.toLowerCase().includes(searchFilter) ||
                    item.name_eng.toLowerCase().includes(searchFilter);
            });

            const totalItemsCount = loadedItemsRaw.length;
            const filteredItemsCount = filteredItems.length;
            document.getElementById('itemCounterDisplay').innerText = `Exibindo ${filteredItemsCount} de ${totalItemsCount} itens`;

            if (loadedItemsRaw.length === 0) {
                container.innerHTML = '<div class="empty-state">Inventário Vazio. Adicione itens acima ou carregue um arquivo .json.</div>';
                return;
            }

            if (filteredItems.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum item correspondente encontrado na busca.</div>';
                return;
            }

            let blockIndex = 1;
            for (let i = 0; i < filteredItems.length; i += itemsPerBlock) {
                const chunk = filteredItems.slice(i, i + itemsPerBlock);

                const wrapper = document.createElement('div');
                wrapper.className = `table-wrapper ${highlightFavorites ? 'show-fav' : ''}`;

                const title = document.createElement('div');
                title.className = 'table-title';
                title.innerText = `${customTitleBase} #${blockIndex}`;
                wrapper.appendChild(title);

                const tableHolder = document.createElement('div');
                tableHolder.className = 'table-rounded-holder';

                const table = document.createElement('table');
                table.innerHTML = `
                <thead>
                    <tr>
                        <th class="col-id th-label-id text-right" style="width: 10%">${idLabel}</th>
                        <th class="col-img th-label-img" style="width: 10%; text-align: center;">${imgLabel}</th>
                        <th class="col-pt th-label-pt" style="width: 30%">${ptLabel}</th>
                        <th class="col-en th-label-en" style="width: 25%">${enLabel}</th>
                        <th class="col-qtd th-label-qtd text-right" style="width: 10%">${qtdLabel}</th>
                        <th class="col-action text-center" style="width: 15%">Ação</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;

                const tbody = table.querySelector('tbody');

                chunk.forEach((item) => {
                    const globalIndex = loadedItemsRaw.indexOf(item);
                    const formattedCount = Number(item.count).toLocaleString('pt-BR');
                    let imageUrl = `sprites/Item_${item.id}.png`;

                    const row = document.createElement('tr');
                    if (item.isFavorited) row.className = 'favorited';
                    const isFav = item.isFavorited ? 'active' : '';
                    // Desabilitar botões Up/Down nos limites
                    const isFirst = globalIndex === 0;
                    const isLast = globalIndex === loadedItemsRaw.length - 1;

                    row.innerHTML = `
                    <td class="col-id text-right" contenteditable="true" data-field="id" data-index="${globalIndex}"><span class="id-badge">${item.id}</span></td>
                    <td class="col-img text-center">
                        ${item.name_eng !== "Unknown Item" ? `
                        <div class="icon-wrapper">
                            <img class="item-sprite" src="${imageUrl}" alt="${item.name_eng}" onerror="this.parentElement.style.display='none';">
                        </div>` : ''}
                    </td>
                    <td class="col-pt" contenteditable="true" data-field="name_ptbr" data-index="${globalIndex}">
                        <span class="star">★</span><strong>${item.name_ptbr}</strong>
                    </td>
                    <td class="col-en" contenteditable="true" data-field="name_eng" data-index="${globalIndex}"><span style="opacity: 0.7; font-style: italic;">${item.name_eng}</span></td>
                    <td class="col-qtd text-right" contenteditable="true" data-field="count" data-index="${globalIndex}">${formattedCount}</td>
                    <td class="col-action text-center">
                        <div class="col-action-container text-center">
                            <span class="star-btn ${isFav}" onclick="toggleFavorite(${globalIndex})" title="Favoritar">★</span>
                            <div class="col-action-order">
                                <button class="move-btn" onclick="moveItemUp(${globalIndex})" ${isFirst ? 'disabled' : ''} title="Subir">▲</button>
                                <button class="move-btn" onclick="moveItemDown(${globalIndex})" ${isLast ? 'disabled' : ''} title="Descer">▼</button>                
                            </div>
                            <span class="delete-btn" onclick="removeItemFromInventory(${globalIndex})" title="Remover">×</span>
                        </div>
                    </td>
                `;
                    tbody.appendChild(row);
                });

                tableHolder.appendChild(table);
                wrapper.appendChild(tableHolder);
                container.appendChild(wrapper);
                blockIndex++;
            }

            updateColumnVisibility();
            attachEditEvents();
            applyWidthConfiguration();
            applyFontConfiguration();
        }

        function updateColumnVisibility() {
            const target = document.getElementById('tablesArea');
            if (!target) return;

            const checkboxes = document.querySelectorAll('.column-toggles input[type="checkbox"]');
            checkboxes.forEach(cb => {
                const className = `hide-col-${cb.getAttribute('data-col')}`;
                if (!cb.checked) {
                    target.classList.add(className);
                } else {
                    target.classList.remove(className);
                }
            });
            saveSettingsToStorage();
        }

        function updateUndoButtonUI() {
            const btn = document.getElementById('undoBtn');
            if (!btn) return;
            btn.disabled = (undoHistoryStack.length === 0);
        }

        window.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    undoAction();
                }
            }
        });

        function attachEditEvents() {
            const editableCells = document.querySelectorAll('td[contenteditable="true"]');

            editableCells.forEach(cell => {
                cell.addEventListener('blur', function () {
                    const index = parseInt(this.getAttribute('data-index'));
                    const field = this.getAttribute('data-field');
                    let newValue = this.innerText.replace(/[\n\r]/g, "").trim();

                    if (field === 'id' || field === 'count') {
                        newValue = parseInt(newValue.replace(/\./g, '')) || loadedItemsRaw[index][field];
                    }

                    if (loadedItemsRaw[index][field] !== newValue) {
                        saveHistoryState();

                        loadedItemsRaw[index][field] = newValue;

                        if (field === 'name_eng' || field === 'id') {
                            if (field === 'id') {
                                const dbItem = itemDatabase[newValue] || { pt: "Item não catalogado", en: "Unknown Item" };
                                loadedItemsRaw[index].name_ptbr = dbItem.pt;
                                loadedItemsRaw[index].name_eng = dbItem.en;
                            }
                            buildSegmentedTables();
                        } else {
                            const totalItemsCount = loadedItemsRaw.length;
                            const filteredItemsCount = document.getElementById('tablesArea').querySelectorAll('tbody tr').length;
                            document.getElementById('itemCounterDisplay').innerText = `Exibindo ${filteredItemsCount} de ${totalItemsCount} itens`;
                        }
                    }
                });

                cell.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.blur();
                    }
                });
            });
        }

        document.querySelectorAll('.column-toggles input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', updateColumnVisibility);
        });

        document.querySelectorAll('.col-name-input').forEach(input => {
            input.addEventListener('input', updateTableHeaderLabels);
        });

        document.getElementById('customListTitleInput').addEventListener('input', updateCustomListTitles);

        document.getElementById('itemsPerBlock').addEventListener('input', () => { buildSegmentedTables(); saveSettingsToStorage(); });
        document.getElementById('showFavCheck').addEventListener('change', () => { buildSegmentedTables(); saveSettingsToStorage(); });
        document.getElementById('searchBox').addEventListener('input', () => { buildSegmentedTables(); saveSettingsToStorage(); });

        document.getElementById('tableWidthInput').addEventListener('input', () => {
            applyWidthConfiguration();
            saveSettingsToStorage();
        });

        document.getElementById('fontSizeInput').addEventListener('input', () => {
            applyFontConfiguration();
            saveSettingsToStorage();
        });
        document.getElementById('iconSizeInput').addEventListener('input', () => {
            applyIconSizeConfiguration();
            saveSettingsToStorage();
        });



        function removeItemFromInventory(globalIndex) {
            saveHistoryState();

            // Remove o item do array principal
            loadedItemsRaw.splice(globalIndex, 1);

            // Reconstrói a tabela
            buildSegmentedTables();

            // Atualiza o contador de itens manualmente para garantir sincronia visual
            const totalItemsCount = loadedItemsRaw.length;
            // Busca quantos itens restaram na visualização atual
            const filteredItemsCount = document.querySelectorAll('#tablesArea tbody tr').length;
            document.getElementById('itemCounterDisplay').innerText = `Exibindo ${filteredItemsCount} de ${totalItemsCount} itens`;
        }
        function toggleFavorite(globalIndex) {
            saveHistoryState(); // Garante que você possa desfazer a mudança

            // Inverte o estado atual
            loadedItemsRaw[globalIndex].isFavorited = !loadedItemsRaw[globalIndex].isFavorited;

            // Reconstrói a tabela para refletir a mudança visual
            buildSegmentedTables();
        }
        // --- SISTEMA DE CAPTURA HTML2CANVAS ---
        function downloadTablesImage() {
            if (loadedItemsRaw.length === 0) {
                alert("O inventário está vazio!");
                return;
            }

            const btn = document.getElementById('printBtnButton');
            const oldText = btn.innerText;
            btn.innerText = "Salvando...";
            btn.disabled = true;

            const targetArea = document.getElementById('tablesArea');
            targetArea.classList.add('hide-actions');

            const wrappers = targetArea.querySelectorAll('.table-wrapper');
            wrappers.forEach(w => w.classList.add('is-printing')); // Força a remoção de sombra para a captura limpa

            setTimeout(() => {

                html2canvas(targetArea, {
                    useCORS: true,
                    allowTaint: false,
                    logging: false,
                    backgroundColor: '#0f1423',
                    scale: 2,

                    onclone: function (clonedDoc) {
                        const clonedArea = clonedDoc.getElementById('tablesArea');
                        clonedArea.style.background = "#0f1423 url('https://www.transparenttextures.com/patterns/black-thread.png')";
                        clonedArea.style.padding = '30px';
                        clonedArea.style.boxSizing = 'border-box';


                        const clonedWrappers = clonedArea.querySelectorAll('.table-wrapper');
                        if (clonedWrappers.length > 0) {
                            clonedWrappers[clonedWrappers.length - 1].style.marginBottom = '0';
                        }
                    }
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'meu_inventario_terraria.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    targetArea.classList.remove('hide-actions');
                    wrappers.forEach(w => w.classList.remove('is-printing'));
                    btn.innerText = oldText;
                    btn.disabled = false;
                }).catch(err => {
                    targetArea.classList.remove('hide-actions');
                    wrappers.forEach(w => w.classList.remove('is-printing'));
                    alert("Erro ao exportar o PNG.");
                    btn.innerText = oldText;
                    btn.disabled = false;
                });
            }, 100);
        }
    </script>

</body>
