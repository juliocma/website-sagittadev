<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Medidas Terraria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <h3>Gerador de Medidas</h3>

        <div class="controls-scroll">

            <div class="control-group">
                <label>Tamanho da Tela (Canvas)</label>
                <div class="control-row">
                    <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                        <label style="font-size:10px;">Largura:</label>
                        <input type="number" id="canvasWidth" value="1920" step="1">
                    </div>
                    <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                        <label style="font-size:10px;">Altura:</label>
                        <input type="number" id="canvasHeight" value="1080" step="1">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <div style="flex:1">
                        <label for="tamanho">Qtd (Blocos):</label>
                        <input type="number" id="tamanho" value="15" min="1" step="1">
                    </div>
                    <div style="flex:2">
                        <label for="textoPersonalizado">Texto Complementar:</label>
                        <input type="text" id="textoPersonalizado" value=" Blocos">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Visibilidade e Animação Inicial</label>
                <div style="display:flex; flex-direction:column; gap:8px; margin-top:5px;">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="mostrarTexto" checked style="width: 16px;"> Mostrar Texto
                    </label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="mostrarSetas" checked style="width: 16px;"> Mostrar Setas nas Pontas
                    </label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="animacaoInicial" checked style="width: 16px;"> Animação Inicial
                        (Losango)
                    </label>
                </div>
            </div>

            <div class="control-group">
                <label>Configurações de Texto</label>
                <div class="control-row" style="margin-bottom: 5px;">
                    <select id="animTexto" style="flex:1; margin-right: 5px;">
                        <option value="nenhuma">Sem Animação (Fixo)</option>
                        <option value="surgir">Surgir Suavemente (Fade)</option>
                        <option value="expandir_zoom">Expandir (Zoom in)</option>
                        <option value="expandir_corte">Revelar (Clipping Mask)</option>
                    </select>
                    <select id="textPos" style="flex:1;">
                        <option value="centro">Fixo no Centro</option>
                        <option value="ponta">Acompanhar Seta</option>
                    </select>
                </div>

                <div class="control-row" style="margin-bottom: 5px;">
                    <label style="flex:1; display:flex; align-items:center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="textoAbaixo" style="width: 16px;">
                        Texto Abaixo da Linha
                    </label>
                </div>

                <div class="control-row">
                    <label>Tamanho da Fonte:</label>
                </div>
                <div class="control-row">
                    <input type="range" id="tamanhoFonte" min="10" max="150" value="28">
                    <input type="number" id="tamanhoFonteNum" min="10" max="150" value="28" class="num-input">
                </div>

                <div class="control-row" style="margin-top: 5px;">
                    <label>Distância do Texto para a Linha:</label>
                </div>
                <div class="control-row">
                    <input type="range" id="distanciaTexto" min="0" max="200" value="15">
                    <input type="number" id="distanciaTextoNum" min="0" max="200" value="15" class="num-input">
                </div>

                <div class="control-row" style="margin-top: 5px;">
                    <label>Rotação do Texto (°):</label>
                </div>
                <div class="control-row">
                    <input type="range" id="rotacaoTexto" min="0" max="360" value="0">
                    <input type="number" id="rotacaoTextoNum" min="0" max="360" value="0" class="num-input">
                </div>
            </div>

            <div class="control-group">
                <label>Cores da Medida</label>
                <div class="colors-container">
                    <div class="color-item">
                        <span>Interna</span>
                        <div class="color-input-wrapper">
                            <input type="color" id="corFill" value="#ffeb3b">
                            <input type="text" id="corFillHex" value="#ffeb3b">
                        </div>
                    </div>
                    <div class="color-item">
                        <span>Borda</span>
                        <div class="color-input-wrapper">
                            <input type="color" id="corBorder" value="#000000">
                            <input type="text" id="corBorderHex" value="#000000">
                        </div>
                    </div>
                    <div class="color-item">
                        <span>Texto</span>
                        <div class="color-input-wrapper">
                            <input type="color" id="corTexto" value="#ffffff">
                            <input type="text" id="corTextoHex" value="#ffffff">
                        </div>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Fundo do Vídeo (Chroma Key CapCut)</label>
                <div class="control-row" style="margin-top: 5px;">
                    <label style="display:flex; align-items:center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="usarFundo" style="width: 16px;">
                        Usar Fundo Sólido
                    </label>
                    <div class="color-input-wrapper" style="width: 120px;">
                        <input type="color" id="corFundo" value="#00FF00">
                        <input type="text" id="corFundoHex" value="#00FF00">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Estilo do Traço e Setas</label>
                <div class="control-row" style="margin-bottom: 5px;">
                    <select id="tipoLinha" style="flex:1;">
                        <option value="solida">Linha Sólida</option>
                        <option value="pontilhada">Linha Pontilhada</option>
                    </select>
                </div>

                <div id="controlesPontilhado" style="display: none; flex-direction: column; gap: 5px;">
                    <div class="control-row">
                        <label>Tam. Traço:</label>
                    </div>
                    <div class="control-row">
                        <input type="range" id="tamanhoTraco" min="5" max="50" value="20">
                        <input type="number" id="tamanhoTracoNum" min="5" max="50" value="20" class="num-input">
                    </div>
                    <div class="control-row">
                        <label>Espaçamento:</label>
                    </div>
                    <div class="control-row">
                        <input type="range" id="espacoTraco" min="2" max="50" value="10">
                        <input type="number" id="espacoTracoNum" min="2" max="50" value="10" class="num-input">
                    </div>
                </div>

                <div class="control-row" style="margin-top: 5px;">
                    <label>Arredondamento das Pontas:</label>
                </div>
                <div class="control-row">
                    <input type="range" id="arredondamento" min="0" max="20" value="8">
                    <input type="number" id="arredondamentoNum" min="0" max="20" value="8" class="num-input">
                </div>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <label>Tamanho da Seta:</label>
                </div>
                <div class="control-row">
                    <input type="range" id="tamanhoSeta" min="10" max="80" value="24">
                    <input type="number" id="tamanhoSetaNum" min="10" max="80" value="24" class="num-input">
                </div>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <label>Largura da Linha (Corpo):</label>
                </div>
                <div class="control-row">
                    <input type="range" id="espessuraLinha" min="2" max="40" value="8">
                    <input type="number" id="espessuraLinhaNum" min="2" max="40" value="8" class="num-input">
                </div>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <label>Espessura da Borda Preta:</label>
                </div>
                <div class="control-row">
                    <input type="range" id="borderWidth" min="0" max="15" value="4">
                    <input type="number" id="borderWidthNum" min="0" max="15" value="4" class="num-input">
                </div>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <label>Duração da Animação (ms):</label>
                </div>
                <div class="control-row">
                    <input type="range" id="velocidade" min="500" max="5000" step="100" value="2000">
                    <input type="number" id="velocidadeNum" min="500" max="5000" step="100" value="2000"
                        class="num-input">
                </div>
            </div>

            <div class="control-group">
                <label>Origem e Suavização:</label>
                <div class="control-row">
                    <select id="origem" style="flex:1; margin-right: 5px;">
                        <option value="centro">Centro</option>
                        <option value="esquerda">Ir p/ Direita</option>
                        <option value="direita">Ir p/ Esquerda</option>
                    </select>
                    <select id="easing" style="flex:1;">
                        <option value="easeOut">Ease Out</option>
                        <option value="easeInOut">Ease In Out</option>
                        <option value="linear">Linear</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <label>Ângulo da Animação (°):</label>
                </div>
                <div class="control-row">
                    <input type="range" id="angulo" min="0" max="360" value="0">
                    <input type="number" id="anguloNum" min="0" max="360" value="0" class="num-input">
                </div>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <label>Zoom Visual (Na Tela):</label>
                </div>
                <div class="control-row">
                    <input type="range" id="zoom" min="0.5" max="8.0" step="0.1" value="1.0">
                    <input type="number" id="zoomNum" min="0.5" max="8.0" step="0.1" value="1.0" class="num-input">
                </div>
            </div>
        </div>

        <div class="actions-panel">
            <div class="control-row" style="margin-bottom: 5px;">
                <label style="color: #ccc; font-weight: bold; font-size: 11px;">Tamanho:</label>
                <select id="tipoExportacao" style="flex: 1; margin-left: 5px;">
                    <option value="canvas">Tela Inteira (Canvas)</option>
                    <option value="objeto">Apenas o Objeto (Cropped)</option>
                </select>
            </div>

            <div class="control-row" style="margin-bottom: 5px;">
                <label style="color: #ccc; font-weight: bold; font-size: 11px;">Qualidade:</label>
                <select id="qualidadeExportacao" style="flex: 1; margin-left: 5px;">
                    <option value="2500000">Normal (2.5 Mbps)</option>
                    <option value="8000000">Alta (8 Mbps)</option>
                    <option value="50000000" selected>Máxima (Sem Perdas)</option>
                </select>
            </div>

            <button onclick="playAnimation()">Play Animação</button>
            <button class="btn-export" onclick="exportVideo()">Exportar WebM</button>
        </div>
    </div>

    <div class="preview-container" id="previewContainer">
        <canvas id="canvas" width="1920" height="1080"></canvas>
    </div>

    <script src="script.js"></script>
</body>

</html>
